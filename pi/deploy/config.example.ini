; lx50pi config. Copy to /etc/lx50pi/config.ini and edit.

[device]
; usb = the LX50 on the mini-USB port. udp / tcp only for the simulator (python -m lx50pi simulate).
transport = usb
usb_vid = 1b55
usb_pid = 0a01
; Confirmed from the USB capture of 2026-09-29 and tested against the real LX50:
;   usb_framing = zkusb (vendor requests 0xF3 / 0xF4 announce each bulk transfer); raw | tcp are for other models
;   usb_ep_out / usb_ep_in = bulk endpoints 0x03 / 0x82 (empty = first bulk pair, which is the same)
;   usb_reply_delay = seconds between a send and asking for the reply; the SDK uses 0.2. Never lower:
;                     asking earlier makes the LX50 stop answering until it is powered off and on.
;   usb_init_controls = extra vendor requests after opening, "type,req,value,index,data;..." (LX50: none)
usb_framing = zkusb
usb_ep_out = 0x03
usb_ep_in = 0x82
usb_reply_delay = 0.2
usb_init_controls =
; host / port for transport = udp or tcp
host = 127.0.0.1
port = 4370
; communication password (Menu > Comm. on the device), 0 = none
password = 0
timeout = 5
; bytes per data read. 1024 for the LX50: with 16384 an LX50 with ~2000 punches dropped off the USB (2026-09-30)
chunk_size = 1024

[poll]
; also how often the cloud is asked for user commands
interval_seconds = 15
; read the users again at least this often even if the user count did not change
full_read_minutes = 60
; only the new punches are read (the end of the device's punch buffer); all punches again only this often
all_punches_hours = 24
; a read of ~2,500 punches takes ~18 s over USB (0.2 s per packet). New punches are read once nobody punched for
; quiet_seconds, at the latest max_wait_seconds after the first new one (morning rush: not after every punch)
quiet_seconds = 20
max_wait_seconds = 120
; yes = keypad / sensor off while reading, like the SDK: the LX50 shows "Working" and a finger put on it then is lost
disable_while_reading = no
; every device poll is a USB session (connect, serial, counts, exit). 2026-10-08: the LX50 hung ("Working", no
; punches) while polled every 15 s and worked through the rush with the cable out. So the device is polled at most
; every device_interval_seconds, and not at all in rush_hours (HH:MM-HH:MM, comma separated, Pi local time):
; punches stay on the device and are read right after the rush; cloud commands wait in the cloud queue.
device_interval_seconds = 60
rush_hours = 09:00-10:30, 17:30-19:00
; yes = send CMD_ENABLEDEVICE before leaving every session (as the SDK does). 2026-10-08: after a punch + a read
; without it the LX50 stayed on "Working" and took no punches
enable_on_exit = yes

[cloud]
; empty url = only store locally
url = https://example.com/api/lx50/punches
; user list (sent when it changed) and the command queue for the React page (see lx50pi/commands.py);
; empty = off
users_url = https://example.com/api/lx50/users
commands_url = https://example.com/api/lx50/commands
token =
device_name = Office LX50
batch_size = 200
verify_tls = yes

[wifi]
; Wi-Fi agent (lx50pi-wifi.service, runs as root) for the /wifisetup page of the web server.
; url empty = [cloud] commands_url with /commands -> /wifi (https://<server>/api/lx50/wifi)
url =
interface = wlan0
; always kept (priority 900); the network chosen on /wifisetup gets priority 999 and replaces the previous one
fallback_ssid = satyendra
interval_seconds = 5

[store]
path = /var/lib/lx50pi/lx50.db
