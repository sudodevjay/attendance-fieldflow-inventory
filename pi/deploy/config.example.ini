; lx50pi config. Copy to /etc/lx50pi/config.ini and edit.

[device]
; usb = the LX50 on the mini-USB port. udp / tcp only for the simulator (python -m lx50pi simulate).
transport = usb
usb_vid = 1b55
usb_pid = 0a01
; NOT CONFIRMED until the USB capture is analysed (analyze/usbpcap_dump.py prints the right values):
;   usb_framing = raw | tcp
;   usb_ep_out / usb_ep_in = bulk endpoint addresses, e.g. 0x01 / 0x81 (empty = first bulk pair)
;   usb_init_controls = vendor control requests the SDK sends first, "type,req,value,index,data;..."
usb_framing = raw
usb_ep_out =
usb_ep_in =
usb_init_controls =
; host / port for transport = udp or tcp
host = 127.0.0.1
port = 4370
; communication password (Menu > Comm. on the device), 0 = none
password = 0
timeout = 5
chunk_size = 16384

[poll]
interval_seconds = 30
; read everything again at least this often even if the punch count did not change
full_read_minutes = 60

[cloud]
; empty url = only store locally
url = https://example.com/api/lx50/punches
token =
device_name = Office LX50
batch_size = 200
verify_tls = yes

[store]
path = /var/lib/lx50pi/lx50.db
