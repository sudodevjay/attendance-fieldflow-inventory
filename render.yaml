# Render blueprint, free plan: two services with their own databases (Supabase PostgreSQL, free), see web/DEPLOY.md.
#   zk-suite            React app + attendance API; the one address of the app: it logs users in and forwards the inventory
#   zk-suite-inventory  inventory API (inventory-api/), own database; only zk-suite calls it (SERVICE_TOKEN)
# The names differ from the live zk-attendance service (other repository), so both can run side by side.
services:
  - type: web
    name: zk-suite
    runtime: node
    plan: free
    # Same region as the Supabase project (Southeast Asia, Singapore): every page runs many small queries.
    region: singapore
    rootDir: web
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Local time of the office: "today", punches and reports use it.
      - key: TZ
        value: Asia/Kolkata
      # postgresql://postgres.<project>:<password>@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # First administrator password (only used while none is set; change it later in the program).
      - key: ADMIN_PASSWORD
        sync: false
      # Password of the /wifisetup page (the Pi's Wi-Fi), only used while none is set.
      - key: WIFI_SETUP_PASSWORD
        sync: false
      # The inventory service (its address as Render shows it) and the secret both services share (made by Render).
      - key: INVENTORY_URL
        value: https://zk-suite-inventory.onrender.com
      - key: SERVICE_TOKEN
        fromService:
          type: web
          name: zk-suite-inventory
          envVarKey: SERVICE_TOKEN

  - type: web
    name: zk-suite-inventory
    runtime: node
    plan: free
    region: singapore
    rootDir: inventory-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      # The inventory's OWN Supabase project (Session pooler URL), not the attendance database.
      - key: DATABASE_URL
        sync: false
      - key: ATTENDANCE_URL
        value: https://zk-suite.onrender.com
      - key: SERVICE_TOKEN
        generateValue: true
