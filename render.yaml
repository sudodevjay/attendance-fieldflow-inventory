# Render blueprint, free plan: two services with their own databases (Supabase PostgreSQL, free), see web/DEPLOY.md.
#   zk-attendance  React app + attendance API; the one address of the app: it logs users in and forwards the inventory
#   zk-inventory   inventory API (inventory-api/), own database; only zk-attendance calls it (SERVICE_TOKEN)
services:
  - type: web
    name: zk-attendance
    runtime: node
    plan: free
    # Same region as the Supabase project (Southeast Asia, Singapore): every page runs many small queries.
    region: singapore
    rootDir: web
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Local time of the office: "today", punches and reports use it.
      - key: TZ
        value: Asia/Kolkata
      # postgresql://postgres.<project>:<password>@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # First administrator password (only used while none is set; change it later in the program).
      - key: ADMIN_PASSWORD
        sync: false
      # Password of the /wifisetup page (the Pi's Wi-Fi), only used while none is set.
      - key: WIFI_SETUP_PASSWORD
        sync: false
      # The inventory service and the secret both services share (any long random text, the same on zk-inventory).
      - key: INVENTORY_URL
        value: https://zk-inventory.onrender.com
      - key: SERVICE_TOKEN
        sync: false

  - type: web
    name: zk-inventory
    runtime: node
    plan: free
    region: singapore
    rootDir: inventory-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      # The inventory's OWN Supabase project (Session pooler URL), not the attendance database.
      - key: DATABASE_URL
        sync: false
      - key: ATTENDANCE_URL
        value: https://zk-attendance.onrender.com
      - key: SERVICE_TOKEN
        sync: false
